[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vascular-age-ml-service"
version = "0.1.0"
description = "An end-to-end machine learning service for PPG-based age-category prediction."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "numpy==2.3.5",
    "pydantic>=2",
    "tensorflow-cpu==2.20.0",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "httpx",
]
